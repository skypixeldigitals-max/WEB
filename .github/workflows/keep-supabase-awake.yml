# Supabase's free tier pauses a project after 7 days without any API request.
# The portfolio page reads from it, so a quiet week takes the page down.
# One tiny read a day keeps it awake. Uses the same publishable key as js/sb.js;
# RLS limits it to reading published properties, same as any site visitor.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC (odd minute avoids GitHub's busy :00 slot)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        run: |
          KEY="sb_publishable_fbpp8zlQeDaPtL88gwCvmw_E--ucTv_"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://vzanpbohmbxchhbqginx.supabase.co/rest/v1/properties?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase responded $code"
          [ "$code" = "200" ]   # fail the run (and email you) if the project is paused
